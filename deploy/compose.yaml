# LEARNER-OWNED (Standard W14 / Fast W11). Describes the platform for Docker Compose.
# No container engine runs in this course: the supplied checks read this file statically
# (cd deploy && npm test -- standard-w14   or   npm test -- fast-w11).
#
# Every value that is a password, token or signing secret is ${VARIABLE} indirection with no
# default; real values live in your untracked .env (see ../.env.example). All data is synthetic.
